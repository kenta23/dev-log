version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: dev-log-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: dev-log
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql   # ✅ not /data

volumes:
  postgres_data: